name: build

# Tests the stubs on every push. A GitHub release created from a vX.Y.Z tag
# also publishes the typeshed JSON to npm as @microbit/micropython-microbit-stubs;
# the versioner takes the version from the tag. Publishing uses npm trusted
# publishing from the separate publish job, as in makecode-embed.
on:
  release:
    types: [created]
  push:
    branches:
      - "**"

env:
  # renovate: datasource=npm depName=npm
  NPM_VERSION: "11"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }} --registry=https://registry.npmjs.org
      - uses: microbit-foundation/npm-package-versioner-action@v3
      - run: npm ci
      - run: npm run ci
      - run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'release'
        with:
          name: npm-tarball
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@${{ env.NPM_VERSION }} --registry=https://registry.npmjs.org
      - run: npm stage publish --allow-file=all ./*.tgz
